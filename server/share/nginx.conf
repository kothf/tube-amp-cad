# Short links on aerocat.tech. Put the zone in the http {} block and the locations in the
# server {} block that serves the site; join the nginx container to the "share" network.
# The site sets real_ip from CF-Connecting-IP, so $binary_remote_addr is the visitor.

# http {}: at most 10 stored designs a minute per visitor
limit_req_zone $binary_remote_addr zone=share:10m rate=10r/m;

# server {}:
# aerocat.tech/s/<id> opens the CAD, which fetches the design by its id; a relative Location
# keeps the visitor on https (behind Cloudflare nginx itself only sees http)
location ~ "^/s/([A-Za-z0-9_-]{10})$" {
    absolute_redirect off;
    return 302 /tools/tube-curve-tracer/circuit_sandbox.html#s=$1;
}
location = /api/share {
    limit_except POST { deny all; }
    limit_req zone=share burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 100k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $share http://tubecad_share:8080;
    proxy_pass $share;                       # a variable: the site stays up while the store is down
}
location ~ "^/api/share/[A-Za-z0-9_-]+$" {
    limit_except GET { deny all; }
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $share http://tubecad_share:8080;
    proxy_pass $share;
}
