<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spectrum Analyzer — Tube Amp CAD</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="ui.css?v=dev">
  <style>
    :root { --bg: #070b10; --panel: #111823; --panel2: #18212e; --line: #26344a; --text: #e6edf3; --muted: #8b949e; --accent: #00e5ff; --ok: #3fb950; --bad: #ff7b72; --warn: #ffb300; }
    select:not([class]), select.btn { background-color: var(--panel2, #131b26); border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; }
    body { background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
    button, select { font: inherit; color: inherit; }
    header { display: flex; align-items: center; gap: 10px; padding: 7px 14px; background: linear-gradient(#141c27, #0e141d); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .brand { font-weight: 800; letter-spacing: .5px; }
    .brand span { color: var(--accent); font-weight: 600; margin-left: 6px; }
    .status { font-size: 12px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 99px; white-space: nowrap; }
    .status::before { content: "●"; margin-right: 6px; }
    .status.progress { background: linear-gradient(var(--accent), var(--accent)) no-repeat left bottom / var(--progress) 2px; }
    .status.ok::before { color: var(--ok); } .status.idle::before { color: var(--muted); } .status.bad { color: var(--bad); }
    select { background: #0b1118; border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; }
    main { display: grid; grid-template-columns: 1fr 320px; gap: 12px; padding: 12px; min-height: 0; }
    .bezel { background: #0d1219; border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; grid-template-rows: 1fr auto auto; min-height: 0; }
    #screen { width: 100%; height: 100%; display: block; border-radius: 6px; min-height: 0; }
    .foot { padding: 8px 4px 0; font: 12px ui-monospace, Menlo, monospace; color: var(--muted); }
    .foot b { color: var(--text); }
    .marks { display: flex; gap: 6px 18px; flex-wrap: wrap; align-items: center; padding: 6px 4px 0; font: 12px ui-monospace, Menlo, monospace; color: #c9d6e3; min-height: 40px; align-content: flex-start; }
    .marks b { font-weight: 600; color: #fff; } .marks .hint { color: var(--muted); font-family: system-ui, sans-serif; }
    .marks .btn { padding: 1px 8px; font-size: 11px; margin-left: auto; }
    aside { overflow-y: auto; min-height: 0; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
    .card h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
    .card h3 b { color: var(--accent); letter-spacing: 0; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
    .row span { color: var(--muted); font-size: 12px; }
    table { width: 100%; border-collapse: collapse; font: 12px ui-monospace, Menlo, monospace; }
    th { text-align: right; color: var(--muted); font-weight: 500; font-size: 11px; padding: 2px 4px; }
    td { text-align: right; padding: 2px 4px; border-top: 1px dashed #1a2433; }
    th:first-child, td:first-child { text-align: left; }
    .muted { color: var(--muted); font-size: 12px; }
    @media (max-width: 900px) { body { overflow: auto; } main { grid-template-columns: 1fr; } .bezel { height: 60vh; } }
  </style>
</head>
<body>
  <header>
    <div class="seg-group doc-switch" role="group" aria-label="Design">
      <button class="btn" id="btn-cad" title="Schematic: the circuit in the Circuit CAD window, opened if it is closed (Alt+S)"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M1 8h3l1-3 1.5 6 1.5-6 1.5 6 1-3h4.5"/></svg><span class="ds-lbl">Schematic</span></button>
      <button class="btn" id="btn-board" title="Board: the PCB layout of this circuit, opened if it is closed (Alt+B)"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><circle cx="5" cy="6" r="1.2"/><circle cx="11" cy="10" r="1.2"/><path d="M6.2 6H9l2 2v.8"/></svg><span class="ds-lbl">Board</span></button>
    </div>
    <div class="brand">Spectrum Analyzer<span>FFT</span></div>
    <span id="status" class="status idle">Waiting for the Circuit CAD…</span>
    <span class="spacer"></span>
    <label class="muted">Scope part <select id="scope-select"></select></label>
    <label class="muted">Input <select id="src"><option value="ch1">CH1</option><option value="ch2">CH2</option></select></label>
    <a class="btn ib" href="help.html#spectrum" target="tube_help" title="Manual: this instrument explained" aria-label="Help"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M6.1 6.2a2 2 0 1 1 2.6 1.9c-.5.2-.7.6-.7 1.1v.5"/><path d="M8 11.6v.2"/></svg></a>
  </header>
  <main>
    <div class="bezel">
      <canvas id="screen" aria-label="Spectrum display"></canvas>
      <div class="foot" id="foot"></div>
      <div class="marks" id="marks"></div>
    </div>
    <aside>
      <div class="card">
        <h3>Frequency &amp; amplitude</h3>
        <div class="row"><span>Span</span><select id="span"><option value="auto">Auto (10 harmonics)</option><option value="1000">0 – 1 kHz</option><option value="5000">0 – 5 kHz</option><option value="10000">0 – 10 kHz</option><option value="20000">0 – 20 kHz</option><option value="50000">0 – 50 kHz</option></select></div>
        <div class="row"><span>Units</span><select id="units"><option value="dbc">dBc (re fundamental)</option><option value="dbv">dBV (re 1 Vrms)</option></select></div>
        <div class="row"><span>Frequency axis</span><select id="fx"><option value="lin">Linear</option><option value="log">Logarithmic</option></select></div>
        <div class="row"><span>Scale</span><select id="scale"><option value="10">10 dB/div</option><option value="5">5 dB/div</option></select></div>
      </div>
      <div class="card">
        <h3>Harmonic distortion <b id="thd"></b></h3>
        <table><thead><tr><th>Harmonic</th><th>Freq</th><th>Level</th><th>%</th></tr></thead><tbody id="harm"></tbody></table>
        <p class="muted">Harmonics of the fundamental measured on this input, computed over an exact whole number of cycles (no windowing error).</p>
      </div>
      <div class="card">
        <h3>Other components</h3>
        <table><tbody id="spurs"></tbody></table>
      </div>
    </aside>
  </main>

  <script src="hints.js?v=dev"></script>
  <script src="windows.js?v=dev"></script>
  <script src="panels.js?v=dev"></script>
  <script src="instrument-common.js?v=dev"></script>
  <script src="scope-math.js?v=dev"></script>
  <script src="markers.js?v=dev"></script>
  <script src="spectrum-app.js?v=dev"></script>
</body>
</html>
