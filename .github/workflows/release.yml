name: Release

# Push a tag like v3.1.0 (matching package.json) to publish:
#   - a GitHub release with tube-amp-cad-<version>.tar.gz + .sha256
#     (consumed by aerocat.tech, pinned by version and checksum)
#   - the same build to GitHub Pages
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Tag must match package.json version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Engine + browser tests (source)
        run: npm test

      - name: Package
        run: npm run package -- "${GITHUB_REF_NAME#v}"

      - name: Browser tests (packaged build)
        run: npm run test:dist

      - name: Release notes from CHANGELOG.md
        run: npm run --silent release-notes -- "$GITHUB_REF_NAME" > release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.tar.gz.sha256 \
            --title "Tube Amp CAD $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/tube-amp-cad

  pages:
    needs: release
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
