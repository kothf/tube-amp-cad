name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# a newer push to a PR cancels its older run; on main every commit gets its own run at once (no
# waiting for the one before), since the release of that commit uses its result instead of testing again
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # the committed WebAssembly solver must be the one wasm/solver.ts builds
      - name: Solver built from its source
        run: npm run build:wasm -- --check

      - name: Engine tests
        run: npm run test:engine

  # the browser tests, on the source and on the packaged build, each split in two groups of
  # tests/e2e parts that take about as long (08 alone is as long as all the others): four jobs side by side
  browser:
    name: browser (${{ matrix.build }}, ${{ matrix.group.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        build: [source, packaged]
        group:
          - { name: "all but 08", parts: "01,02,03,04,05,06,07,09,10,11,12,13,14,15,16", reference: true }
          - { name: "08", parts: "08", reference: false }
    env:
      APP: ${{ matrix.build == 'packaged' && 'dist/tube-amp-cad' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Playwright's headless Chromium, kept between runs (keyed by the locked
      # Playwright version). The runner image already has Chrome's system
      # libraries, so no apt step; full Google Chrome would run the tests 2x slower.
      - name: Cache Playwright's browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Browser for the tests
        run: npx playwright install --only-shell chromium || npx playwright install --with-deps --only-shell chromium

      - name: Package
        if: matrix.build == 'packaged'
        run: npm run package

      - name: Browser tests
        env:
          E2E_PARTS: ${{ matrix.group.parts }}
        run: node tests/e2e.mjs $APP

      - name: Reference circuits
        if: matrix.group.reference
        run: node tests/reference.mjs $APP
