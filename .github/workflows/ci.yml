name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Browser for the tests (the runner's Google Chrome; Playwright's Chromium if missing)
        run: |
          if chrome="$(command -v google-chrome || command -v google-chrome-stable)"; then
            echo "CHROMIUM_PATH=$chrome" >> "$GITHUB_ENV"; "$chrome" --version
          else
            npx playwright install --with-deps chromium
          fi

      - name: Engine + browser tests (source)
        run: npm test

      - name: Package
        run: npm run package

      - name: Browser tests (packaged build)
        run: npm run test:dist
